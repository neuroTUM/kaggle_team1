name: Ruff and Ty
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ty Check
        run: uv run ty check
        
      - name: Run Ruff Check
        run: uv run ruff check .

      - name: Check format
        run: uv run ruff format --check