repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ty-check
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
    