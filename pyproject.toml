[project]
name = "kaggle-team1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "asrpy>=0.0.8",
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "numpy>=2.0,<2.3",
    "omegaconf>=2.3.1",
    "pandas>=3.1.1",
    "pre-commit>=4.7.0",
    "pyriemann>=0.12",
    "ruff>=0.17.6",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

# CUDA build of PyTorch on Windows/Linux (PyPI only ships CPU wheels for Windows).
# macOS keeps the default PyPI wheel. CUDA wheels also run on machines without a GPU.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[dependency-groups]
dev = [
    "ty>=0.0.112",
]
